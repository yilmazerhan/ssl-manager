services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ssl_manager
      POSTGRES_PASSWORD: ssl_manager_dev
      POSTGRES_DB: ssl_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssl_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8200/v1/sys/health?standbyok=true"]
      interval: 5s
      timeout: 5s
      retries: 10

  vault-init:
    image: hashicorp/vault:1.17
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    entrypoint: ["sh", "-c", "vault secrets enable transit || true"]
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      SSL_MANAGER_ADDR: ":8080"
      DATABASE_URL: "postgres://ssl_manager:ssl_manager_dev@postgres:5432/ssl_manager"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "dev-root-token"
      # Staging by default so a stray docker-compose up never burns
      # production Let's Encrypt rate limits; point at the real directory
      # (lego.LEDirectoryProduction) once you're ready to issue for real.
      LETSENCRYPT_DIRECTORY_URL: "https://acme-staging-v02.api.letsencrypt.org/directory"
      LETSENCRYPT_ENVIRONMENT: "staging"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL:-admin@example.com}"
      ZEROSSL_API_KEY: "${ZEROSSL_API_KEY:-}"
      SESSION_SECRET: "${SESSION_SECRET:-change-me-in-any-real-deployment}"
      DEV_AUTH_ENABLED: "${DEV_AUTH_ENABLED:-true}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URL: "${OIDC_REDIRECT_URL:-http://localhost:8080/auth/callback}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
      SMTP_ADDR: "${SMTP_ADDR:-}"
      SMTP_TO: "${SMTP_TO:-}"
      NOTIFY_WEBHOOK_URL: "${NOTIFY_WEBHOOK_URL:-}"
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
